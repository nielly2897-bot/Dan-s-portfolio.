[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'none'; script-src 'self' https://link.msgsndr.com 'sha256-qYK06u5xEhuOqXk6my6gUqK8lbr6Z/fJ9Qxq5HoGtio='; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self' https://assets.cdn.filesafe.space; font-src 'self'; connect-src 'self'; manifest-src 'self'; frame-src https://api.leadconnectorhq.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    Permissions-Policy = 'camera=(), microphone=(), geolocation=(), payment=("https://api.leadconnectorhq.com"), usb=()'

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
